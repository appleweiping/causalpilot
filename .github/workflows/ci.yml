name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
      - name: Command line smoke test
        run: |
          causalpilot simulate /tmp/test.csv --n 20000 --lift 0.1
          causalpilot analyze /tmp/test.csv --group arm --control control --metric converted --covariate prior_orders --out /tmp/report
          test -s /tmp/report/effects.png
      - name: Benchmark smoke run
        run: python benchmark/run_benchmark.py --runs 2 --out /tmp/bench

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser version gives the same numbers as Python
        run: node --test web/test/parity.test.mjs
