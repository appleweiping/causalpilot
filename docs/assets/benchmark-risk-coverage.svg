<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600" role="img"><title>Safety versus deployment coverage in the 50-seed synthetic engineering benchmark</title><desc>TRACE has 2 false-deployment episodes in 50 controlled episodes at 26% mean coverage. Deterministic proxies cover more opportunities but make more unsafe deployments. This is simulated evidence, not a live result.</desc><defs><radialGradient id="bg"><stop stop-color="#18243b"/><stop offset="1" stop-color="#070b14"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1040" height="600" rx="28" fill="url(#bg)"/><text x="54" y="42" fill="#f4f7ff" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="700">Safety–coverage mechanism check</text><text x="54" y="66" fill="#8f9db5" font-family="Inter,Segoe UI,sans-serif" font-size="13">50 seeds · 600 deterministic policy runs · simulated ground truth</text><line x1="112.0" y1="78" x2="112.0" y2="498" stroke="#233149" stroke-width="1"/><line x1="112" y1="498.0" x2="872" y2="498.0" stroke="#233149" stroke-width="1"/><text x="112.0" y="522" text-anchor="middle" fill="#8390a6" font-family="Inter,Segoe UI,sans-serif" font-size="12">0.0</text><text x="94" y="502.0" text-anchor="end" fill="#8390a6" font-family="Inter,Segoe UI,sans-serif" font-size="12">0.0</text><line x1="264.0" y1="78" x2="264.0" y2="498" stroke="#233149" stroke-width="1"/><line x1="112" y1="414.0" x2="872" y2="414.0" stroke="#233149" stroke-width="1"/><text x="264.0" y="522" text-anchor="middle" fill="#8390a6" font-family="Inter,Segoe UI,sans-serif" font-size="12">0.2</text><text x="94" y="418.0" text-anchor="end" fill="#8390a6" font-family="Inter,Segoe UI,sans-serif" font-size="12">0.2</text><line x1="416.0" y1="78" x2="416.0" y2="498" stroke="#233149" stroke-width="1"/><line x1="112" y1="330.0" x2="872" y2="330.0" stroke="#233149" stroke-width="1"/><text x="416.0" y="522" text-anchor="middle" fill="#8390a6" font-family="Inter,Segoe UI,sans-serif" font-size="12">0.4</text><text x="94" y="334.0" text-anchor="end" fill="#8390a6" font-family="Inter,Segoe UI,sans-serif" font-size="12">0.4</text><line x1="568.0" y1="78" x2="568.0" y2="498" stroke="#233149" stroke-width="1"/><line x1="112" y1="246.0" x2="872" y2="246.0" stroke="#233149" stroke-width="1"/><text x="568.0" y="522" text-anchor="middle" fill="#8390a6" font-family="Inter,Segoe UI,sans-serif" font-size="12">0.6</text><text x="94" y="250.0" text-anchor="end" fill="#8390a6" font-family="Inter,Segoe UI,sans-serif" font-size="12">0.6</text><line x1="720.0" y1="78" x2="720.0" y2="498" stroke="#233149" stroke-width="1"/><line x1="112" y1="162.0" x2="872" y2="162.0" stroke="#233149" stroke-width="1"/><text x="720.0" y="522" text-anchor="middle" fill="#8390a6" font-family="Inter,Segoe UI,sans-serif" font-size="12">0.8</text><text x="94" y="166.0" text-anchor="end" fill="#8390a6" font-family="Inter,Segoe UI,sans-serif" font-size="12">0.8</text><line x1="872.0" y1="78" x2="872.0" y2="498" stroke="#233149" stroke-width="1"/><line x1="112" y1="78.0" x2="872" y2="78.0" stroke="#233149" stroke-width="1"/><text x="872.0" y="522" text-anchor="middle" fill="#8390a6" font-family="Inter,Segoe UI,sans-serif" font-size="12">1.0</text><text x="94" y="82.0" text-anchor="end" fill="#8390a6" font-family="Inter,Segoe UI,sans-serif" font-size="12">1.0</text><text x="492.0" y="564" text-anchor="middle" fill="#b9c4d7" font-family="Inter,Segoe UI,sans-serif" font-size="14">Mean deployment coverage →</text><text x="28" y="288.0" transform="rotate(-90 28 288.0)" text-anchor="middle" fill="#b9c4d7" font-family="Inter,Segoe UI,sans-serif" font-size="14">False-deployment episode rate →</text><circle cx="308.1" cy="481.2" r="13" fill="#73fbd3" fill-opacity="0.18" stroke="#73fbd3" stroke-width="3" filter="url(#glow)"/><text x="322.1" y="471.2" text-anchor="start" fill="#73fbd3" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">TRACE</text><text x="322.1" y="487.2" text-anchor="start" fill="#8795ab" font-family="Inter,Segoe UI,sans-serif" font-size="11">coverage 26% · false deploy 4%</text><circle cx="720.0" cy="178.8" r="9" fill="#ffb454" fill-opacity="0.18" stroke="#ffb454" stroke-width="3" filter="url(#glow)"/><text x="734.0" y="201.8" text-anchor="start" fill="#ffb454" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">No TRACE</text><text x="734.0" y="217.8" text-anchor="start" fill="#8795ab" font-family="Inter,Segoe UI,sans-serif" font-size="11">coverage 80% · false deploy 76%</text><circle cx="611.3" cy="254.4" r="9" fill="#a58cff" fill-opacity="0.18" stroke="#a58cff" stroke-width="3" filter="url(#glow)"/><text x="597.3" y="238.4" text-anchor="end" fill="#a58cff" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">Fixed pipeline</text><text x="597.3" y="254.4" text-anchor="end" fill="#8795ab" font-family="Inter,Segoe UI,sans-serif" font-size="11">coverage 66% · false deploy 58%</text><circle cx="698.0" cy="195.6" r="9" fill="#ff6b8a" fill-opacity="0.18" stroke="#ff6b8a" stroke-width="3" filter="url(#glow)"/><text x="684.0" y="217.6" text-anchor="end" fill="#ff6b8a" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">Direct proxy</text><text x="684.0" y="233.6" text-anchor="end" fill="#8795ab" font-family="Inter,Segoe UI,sans-serif" font-size="11">coverage 77% · false deploy 72%</text><circle cx="872.0" cy="78.0" r="9" fill="#ff4d5f" fill-opacity="0.18" stroke="#ff4d5f" stroke-width="3" filter="url(#glow)"/><text x="858.0" y="64.0" text-anchor="end" fill="#ff4d5f" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">Always deploy</text><text x="858.0" y="80.0" text-anchor="end" fill="#8795ab" font-family="Inter,Segoe UI,sans-serif" font-size="11">coverage 100% · false deploy 100%</text><circle cx="112.0" cy="498.0" r="9" fill="#83a8ff" fill-opacity="0.18" stroke="#83a8ff" stroke-width="3" filter="url(#glow)"/><text x="126.0" y="490.0" text-anchor="start" fill="#83a8ff" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">Always escalate</text><text x="126.0" y="506.0" text-anchor="start" fill="#8795ab" font-family="Inter,Segoe UI,sans-serif" font-size="11">coverage 0% · false deploy 0%</text><rect x="892" y="88" width="120" height="92" rx="12" fill="#0c1321" stroke="#26354f"/><text x="908" y="113" fill="#73fbd3" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="700">TRACE</text><text x="908" y="136" fill="#f4f7ff" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="700">2 / 50</text><text x="908" y="156" fill="#8997ad" font-family="Inter,Segoe UI,sans-serif" font-size="11">false-deploy episodes</text><text x="54" y="568" fill="#718097" font-family="Inter,Segoe UI,sans-serif" font-size="11">Controlled-simulation engineering benchmark. Proxies are decision rules, not executions of named LLMs. Source: evaluation/results.</text></svg>