[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "causalpilot"
version = "0.1.0"
description = "Deterministic TRACE agentic experimentation backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pydantic>=2.6,<3",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=9.0.3,<10"]

[tool.hatch.build.targets.wheel]
packages = ["causalpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
